[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"

# Optimizer settings to prevent "Stack too deep" errors
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_solc = true
evm_version = "Istanbul"
dotenv = ".env"

[rpc_endpoints]
arc_testnet = "${RPC_URL_ARC_TESTNET}"

# Remappings for easier imports
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
